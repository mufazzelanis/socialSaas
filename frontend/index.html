<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Schedule and publish posts to Facebook, Instagram, LinkedIn and Telegram from one dashboard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Runs before anything renders so there's no flash of the wrong theme
      // while React boots up — ThemeProvider (src/context/ThemeContext.jsx)
      // takes over from here once it mounts, using the same storage key.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();

      // Same idea for the tenant's own favicon/title/theme-color: this tag
      // ships with the generic defaults baked in, and BrandProvider
      // (src/context/BrandContext.jsx) only learns the real branding after
      // its own JS chunk loads and /brand-settings resolves. On a reload
      // that gap is exactly when the browser paints the tab icon, so
      // without this, every reload shows the default favicon.svg for a
      // beat (or, on browsers slow to re-poll a changed <link href>, keeps
      // showing it). BrandProvider caches the last-fetched branding here on
      // every successful load, so this runs first and applies it
      // immediately, then BrandProvider re-fetches and corrects it if the
      // branding has changed since the cache was written.
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('brand_cache') || 'null');
          if (!cached) return;
          if (cached.brand_name) document.title = cached.brand_name;
          if (cached.primary_color) {
            var themeColor = document.querySelector("meta[name='theme-color']");
            if (themeColor) themeColor.content = cached.primary_color;
          }
          var iconHref = cached.favicon_url || null;
          if (iconHref) {
            var icon = document.querySelector("link[rel~='icon']");
            if (icon) {
              icon.href = iconHref;
              icon.removeAttribute('type');
            }
          }
          var touchHref = cached.favicon_url || cached.logo_url || null;
          if (touchHref) {
            var touch = document.querySelector("link[rel='apple-touch-icon']");
            if (touch) touch.href = touchHref;
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social SaaS" />
    <title>Social SaaS — Manage all your social media in one place</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
